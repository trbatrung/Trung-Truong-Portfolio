<script>
  // before anything paints: in the site's hero the page is see-through from the first frame, not after three.js loads
  { const q = new URLSearchParams(location.search), c = document.documentElement.classList;
    if (q.get('bg') === 'none') c.add('clear'); if (q.get('embed') === '1') c.add('embed');
    // on wide screens the iframe fills the site's whole hero, so the map runs under the headline when zoomed in. The site
    // says where the headline ends (?top=, then a message whenever its layout changes); the map frames itself below that.
    // Kept here so no message is missed while three.js loads
    window.__inset = { top: +q.get('top') || 0 };
    addEventListener('message', e => {
      if (e.origin !== location.origin || !e.data || e.data.type !== 'site:inset') return;
      window.__inset = { top: +e.data.top || 0 }; dispatchEvent(new Event('inset'));
    });
    // the site holds the map while nobody can see it (scrolled away, or under the board), so it stops drawing
    window.__held = false;
    addEventListener('message', e => {
      if (e.origin !== location.origin || !e.data || e.data.type !== 'site:hold') return;
      window.__held = !!e.data.held; dispatchEvent(new Event('hold'));
    });
    // no WebGL at all: tell the site at once, so it shows a still instead of a loading label
    const c3 = document.createElement('canvas');
    if (q.get('embed') === '1' && parent !== window && !(c3.getContext('webgl2') || c3.getContext('webgl'))) parent.postMessage({ type: 'studio:failed' }, location.origin); }

// ---------- URL overrides
const Q = new URLSearchParams(location.search);
const EXPORT = Q.get('export') === '1', EMBED = Q.get('embed') === '1', CLEAR = Q.get('bg') === 'none';
if (CLEAR) document.documentElement.classList.add('clear');

measure();

// ---------- math: everything animated is a pure function of time

// ---------- rounded-rectangle loops: the street and its lanes, the dolly track
const CA = 10.5, CB = 11.5, CR = 4, ROAD = 2.2, WALK = 3.6, PAD_Y = 0.22;

    { len: a,     p: u => [cx - u, cz + B] },
    { len: q,     p: u => arc(-a, b, Math.PI / 2 + u / R) },
    { len: 2 * b, p: u => [cx - A, cz + b - u] },
    { len: q,     p: u => arc(-a, -b, Math.PI + u / R) },
    { len: 2 * a, p: u => [cx - a + u, cz - B] },
    { len: q,     p: u => arc(a, -b, 1.5 * Math.PI + u / R) },
    { len: 2 * b, p: u => [cx + A, cz - b + u] },
    { len: q,     p: u => arc(a, b, u / R) },
    { len: a,     p: u => [cx + a - u, cz + B] },

    return { x, z, h: Math.atan2(-dz, dx), hp: Math.atan2(dx, dz), nx: -dz, nz: dx };   // h: +x forward, hp: +z forward, n: inward

  const h = heads.add(group, x, floor + lift + bh + 0.15, z, { color: o.skin ?? pick(SKINS) });

  document.addEventListener('visibilitychange', () => (document.hidden ? stop() : go()));
  addEventListener('hold', () => (window.__held ? stop() : go()));
})();
</script>
