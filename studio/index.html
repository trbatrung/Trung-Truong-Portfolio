<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline Diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f1ede6; --ink: #1a1a1a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  /* the frame is CONFIG-sized and CSS-scaled to fit; sizes below are in rem, where 1rem = min(w,h)/108 px */
  #frame { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; overflow: hidden; background: var(--bg); }
  #frame canvas { display: block; }
  body.embed #frame canvas { pointer-events: none; }
  body.embed .card { display: none; }   /* on the site the headline sits right above the window */
  #ui { position: absolute; inset: 0; pointer-events: none; color: var(--ink); font-family: 'Space Grotesk', system-ui, sans-serif; }
  .card { position: absolute; border-radius: 2.2rem; overflow: hidden;
    background: rgba(255,255,255,.58); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid rgba(255,255,255,.95); box-shadow: 0 1.6rem 4.8rem rgba(58,44,30,.16), 0 0 0 1px rgba(26,26,26,.05); }
  .card.portrait { left: 50%; top: 6rem; width: 86rem; transform: translateX(-50%); }
  .card.landscape { left: 4.8rem; bottom: 4.8rem; width: 56rem; }   /* bottom left sits over filler, never a district */
  .bar { position: relative; height: 4.6rem; display: flex; align-items: center; padding: 0 2rem; border-bottom: 1px solid rgba(26,26,26,.07); }
  .lights { display: flex; gap: .9rem; }
  .lights i { width: 1.35rem; height: 1.35rem; border-radius: 50%; display: block; }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .fname { position: absolute; left: 0; right: 0; text-align: center; font: 500 1.7rem/1 'IBM Plex Mono', monospace; color: rgba(26,26,26,.5); }
  .body { padding: 2.8rem 3.2rem 3rem; }
  .body h1 { margin: 0; font-weight: 600; font-size: 5.8rem; line-height: 1; letter-spacing: -.035em; }
  .sub { margin: 1.2rem 0 0; font-size: 2.4rem; line-height: 1.3; color: rgba(26,26,26,.62); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; margin-top: 2.8rem; padding-top: 2.4rem; border-top: 1px solid rgba(26,26,26,.08); }
  .stat .n { font: 500 6.4rem/1 'IBM Plex Mono', monospace; letter-spacing: -.04em; }
  .stat .l { display: flex; gap: .9rem; align-items: flex-start; margin-top: 1.1rem; font: 500 1.45rem/1.3 'IBM Plex Mono', monospace; letter-spacing: .07em; text-transform: uppercase; color: rgba(26,26,26,.56); }
  .dot { flex: none; width: 1.1rem; height: 1.1rem; margin-top: .2rem; border-radius: 50%; }
  .card.landscape .body h1 { font-size: 4.8rem; }
  .card.landscape .sub { font-size: 2.1rem; }
  .card.landscape .stat .n { font-size: 5rem; }
  .card.landscape .stat .l { font-size: 1.3rem; }
  .pill { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: .9rem; padding: .85rem 1.6rem; white-space: nowrap;
    border-radius: 99rem; background: rgba(255,255,255,.84); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 .8rem 2.4rem rgba(58,44,30,.14), 0 0 0 1px rgba(26,26,26,.05);
    font: 600 1.5rem/1 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="frame">
  <canvas id="c"></canvas>
  <div id="ui">
    <div class="card" id="card">
      <div class="bar"><span class="lights"><i></i><i></i><i></i></span><span class="fname" id="fname"></span></div>
      <div class="body"><h1 id="title"></h1><p class="sub" id="sub"></p><div class="stats" id="stats"></div></div>
    </div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const CONFIG = {
  duration: 60, beat: 10, fps: 30, introDuration: 1.5, seed: 42, intro: true,   // the full loop is 60s; traffic and small moves repeat every 10s beat
  size: [1080, 1920],
  zones: {
    research:   { name: 'Research',         color: '#4f9fe6', stat: '6',  label: 'use cases tested' },
    aiWork:     { name: 'AI work',          color: '#57cbbb', stat: '3',  label: 'AI systems directed' },
    production: { name: 'Video production', color: '#e6a15b', stat: '8+', label: 'years in production' },
  },
  accent: '#e8573f',
  neutrals: { background: '#f1ede6', slab: '#e7e1d8', light: '#d9d3ca', mid: '#a39b91', dark: '#3a3633', ink: '#1a1a1a',
    road: '#9c958d', bike: '#b2aba2', walk: '#e2dbd0', grass: '#c9d4b8', path: '#e9dfcd', leaf: '#97b08a', wall: '#f4efe6', desk: '#efe8dd' },
  title: 'Ethan Truong',
  subtitle: 'Research, AI work, video production. One pipeline.',
  windowTitle: 'pipeline.live',
  quality: 'high',
};

// ---------- URL overrides
const Q = new URLSearchParams(location.search);
if (Q.has('w') && Q.has('h')) CONFIG.size = [Math.round(+Q.get('w')), Math.round(+Q.get('h'))];
if (Q.get('quality') === 'low') CONFIG.quality = 'low';
if (Q.get('intro') === '0') CONFIG.intro = false;
const EXPORT = Q.get('export') === '1', EMBED = Q.get('embed') === '1';
const [W, H] = CONFIG.size, D = CONFIG.beat, LOOP = CONFIG.duration, FPS = CONFIG.fps;   // LOOP is a whole number of beats
const INTRO = CONFIG.intro ? CONFIG.introDuration : 0, HIGH = CONFIG.quality !== 'low', PORTRAIT = H > W;
const N = CONFIG.neutrals, ZN = CONFIG.zones, ACC = CONFIG.accent;
if (EMBED) document.body.classList.add('embed');

// ---------- math (everything below is a pure function of time)
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const smooth = u => u * u * (3 - 2 * u);
const easeOutCubic = u => 1 - Math.pow(1 - u, 3);
const easeOutBack = u => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const fract = v => v - Math.floor(v);
const wave = (t, k, ph = 0) => Math.sin(TAU * (k * t / D + ph));        // integer k keeps it periodic in D
const lerpAngle = (a, b, u) => a + ((((b - a + Math.PI) % TAU) + TAU) % TAU - Math.PI) * u;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(CONFIG.seed);                                     // layout only, at startup
const rr = (a, b) => a + (b - a) * rng();
const pick = arr => arr[Math.floor(rng() * arr.length)];

// ---------- renderer, camera, light, passes
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
const RIVER_CLIP = [new THREE.Plane(new THREE.Vector3(-1, 0, 0), 23), new THREE.Plane(new THREE.Vector3(1, 0, 0), 23)];   // boats vanish at the river's ends

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(25, W / H, 20, 700);

// late afternoon in Saigon: a lower, warmer sun, so each district's own lights can show
scene.add(new THREE.HemisphereLight(0xfff1df, 0xd6c4ad, 1.05));
const sun = new THREE.DirectionalLight(0xffd8a8, 2.2);
sun.position.set(-42, 44, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(HIGH ? 2048 : 1024, HIGH ? 2048 : 1024);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 200 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
composer.setPixelRatio(1);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
if (HIGH) {
  const ao = new GTAOPass(scene, camera, W, H);
  ao.blendIntensity = 1;
  ao.updateGtaoMaterial({ radius: 0.9, distanceExponent: 1, thickness: 1.4, scale: 1, samples: 16 });
  ao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
  if (ao.normalMaterial) ao.normalMaterial.clippingPlanes = RIVER_CLIP;   // so a boat past the river's end casts no AO
  composer.addPass(ao);
}
composer.addPass(new OutputPass());

// ACES shifts every color, the background too. Solve once for the input that lands on the exact off-white.
const bgTarget = new THREE.Color(N.background), bg = bgTarget.clone();
scene.background = bg;
{
  const gl = renderer.getContext(), px = new Uint8Array(4), got = new THREE.Color();
  camera.position.set(0, 60, 120); camera.lookAt(0, 0, 0);
  for (let i = 0; i < 10; i++) {
    composer.render();
    gl.readPixels(W >> 1, H >> 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    got.setRGB(px[0] / 255, px[1] / 255, px[2] / 255, THREE.SRGBColorSpace);
    for (const c of ['r', 'g', 'b']) bg[c] *= clamp(bgTarget[c] / Math.max(got[c], 1e-4), 0.6, 2.5);
  }
}

// ---------- materials and geometry helpers
const matCache = new Map();
function mat(hex, rough = 0.74) {
  const k = hex + rough;
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: 0 }));
  return matCache.get(k);
}
// screens, LEDs and lit windows: a standard material that also emits its own (instance) color
function glowMat(hex = '#ffffff', k = 0.8, own = false) {
  const key = 'glow' + hex + k;
  if (!own && matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshStandardMaterial({ color: hex, roughness: 0.45, metalness: 0 });
  m.onBeforeCompile = s => { s.fragmentShader = s.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>\n totalEmissiveRadiance += diffuseColor.rgb * ${k.toFixed(3)};`); };
  m.customProgramCacheKey = () => 'glow' + k.toFixed(3);
  if (!own) matCache.set(key, m);
  return m;
}
const matOf = c => typeof c === 'string' ? mat(c) : c;
const geoCache = new Map();
function rbox(w, h, d, r = 0.06) {
  r = Math.max(0.002, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001));
  const k = [w, h, d, r].join('|');
  if (!geoCache.has(k)) geoCache.set(k, new RoundedBoxGeometry(w, h, d, 2, r));
  return geoCache.get(k);
}
function cylGeo(rt, rb, h, seg = 20) {
  const k = ['c', rt, rb, h, seg].join('|');
  if (!geoCache.has(k)) geoCache.set(k, new THREE.CylinderGeometry(rt, rb, h, seg));
  return geoCache.get(k);
}
function mesh(geo, material, x, y, z, parent) {
  const m = new THREE.Mesh(geo, matOf(material));
  m.castShadow = m.receiveShadow = true;
  m.position.set(x, y, z);
  (parent || scene).add(m);
  return m;
}
const box = (p, w, h, d, c, x, y, z, r = 0.06) => mesh(rbox(w, h, d, r), c, x, y + h / 2, z, p);   // y is the bottom
const cyl = (p, rt, rb, h, c, x, y, z, seg) => mesh(cylGeo(rt, rb, h, seg), c, x, y + h / 2, z, p);
const tint = (hex, k) => '#' + new THREE.Color(N.background).lerp(new THREE.Color(hex), k).getHexString();

// ---------- build-in: pieces rise and pop, the street first, then each district center outward
const GROUPS = {
  base:       { start: 0.00, spread: 0.45, cx: 0,     cz: 0,     norm: 34 },
  research:   { start: 0.45, spread: 0.20, cx: -18.9, cz: 0,     norm: 13 },
  ai:         { start: 0.70, spread: 0.20, cx: 0,     cz: -19.4, norm: 13 },
  production: { start: 0.95, spread: 0.20, cx: 18.9,  cz: 0,     norm: 13 },
};
const POP = 0.35;
const buildStart = (g, x, z) => { const G = GROUPS[g]; return G.start + G.spread * Math.min(1, Math.hypot(x - G.cx, z - G.cz) / G.norm); };
function build(T, start) {
  if (T >= INTRO) return [0, 1];
  const e = clamp((T - start) / POP);
  return [-1.6 * (1 - easeOutCubic(e)), easeOutBack(e)];
}

const pieces = [];
function piece(obj, group, o = {}) {
  if (!obj.parent) scene.add(obj);
  pieces.push({ obj, baseY: obj.position.y, baseS: obj.scale.clone(), start: o.start ?? buildStart(group, obj.position.x, obj.position.z), anim: o.anim });
  return obj;
}
function grp(group, x, z, y = 0, o = {}) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  if (o.ry) g.rotation.y = o.ry;
  return piece(g, group, o);
}

// ---------- local light: each district is lit its own way (warm lamps, teal glow, white studio light).
// A light fades up with its district's build-in; o.anim(t) can scale it, on whole cycles per loop.
const lights = [];
function lamp(group, type, hex, intensity, x, y, z, o = {}) {
  const L = type === 'spot' ? new THREE.SpotLight(hex, intensity, o.dist ?? 14, o.angle ?? 0.55, o.pen ?? 0.7, 2)
                            : new THREE.PointLight(hex, intensity, o.dist ?? 8, 2);
  L.position.set(x, y, z);
  scene.add(L);
  if (type === 'spot') { L.target.position.set(...o.at); scene.add(L.target); }
  lights.push({ L, base: intensity, start: buildStart(group, x, z), anim: o.anim });
  return L;
}
// a soft additive pool of light on the floor under a lamp
const poolTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.45, 'rgba(255,255,255,.45)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
function pool(group, x, z, r, hex, k = 0.35, y = 0.235) {
  const m = new THREE.MeshBasicMaterial({ map: poolTex, color: hex, transparent: true, opacity: k, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(2 * r, 2 * r), m);
  p.rotation.x = -Math.PI / 2; p.position.set(x, y, z); p.renderOrder = 2;
  return piece(p, group);
}
// glowing, see-through material for the hologram and light cones
const holoMat = (hex, k) => new THREE.MeshBasicMaterial({ color: hex, transparent: true, opacity: k, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false });

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
const insts = [];
class Inst {
  constructor(geo, material, max, cast = true) {
    this.mesh = new THREE.InstancedMesh(geo, matOf(material), max);
    this.mesh.castShadow = cast; this.mesh.receiveShadow = true;
    this.mesh.count = 0; this.mesh.frustumCulled = false;
    this.items = []; this.S = {};
    scene.add(this.mesh); insts.push(this);
  }
  add(group, x, y, z, o = {}) {
    const it = { b: { x, y, z, rx: o.rx || 0, ry: o.ry || 0, rz: o.rz || 0, sx: o.sx ?? 1, sy: o.sy ?? 1, sz: o.sz ?? 1, c: new THREE.Color(o.color ?? '#ffffff') },
      start: o.start ?? buildStart(group, x, z), anim: o.anim };
    this.items.push(it);
    this.mesh.count = this.items.length;
    return it;
  }
  update(T, t, tf) {
    const S = this.S;
    this.items.forEach((it, i) => {
      Object.assign(S, it.b);
      if (it.anim) it.anim(S, t, tf);
      const [dy, sc] = build(T, it.start), k = Math.max(sc, 1e-4);
      _p.set(S.x, S.y + dy, S.z);
      _q.setFromEuler(_e.set(S.rx, S.ry, S.rz, 'YXZ'));
      _s.set(S.sx * k, S.sy * k, S.sz * k);
      this.mesh.setMatrixAt(i, _m.compose(_p, _q, _s));
      this.mesh.setColorAt(i, S.c);
    });
    this.mesh.instanceMatrix.needsUpdate = true;
    if (this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate = true;
  }
}

// ---------- rounded-rectangle loops: the street, its lanes, the dolly track
const CA = 10.5, CB = 11.5, CR = 4, ROAD = 2.2, WALK = 3.6, PAD_Y = 0.22;
function makeRR(cx, cz, A, B, R) {
  R = Math.max(R, 0.01);
  const a = A - R, b = B - R, q = Math.PI * R / 2;
  const arc = (ox, oz, th) => [cx + ox + R * Math.cos(th), cz + oz + R * Math.sin(th)];
  // starts at the near-side middle and runs one way: left side, far side, right side, back
  const segs = [
    { len: a,     p: u => [cx - u, cz + B] },
    { len: q,     p: u => arc(-a, b, Math.PI / 2 + u / R) },
    { len: 2 * b, p: u => [cx - A, cz + b - u] },
    { len: q,     p: u => arc(-a, -b, Math.PI + u / R) },
    { len: 2 * a, p: u => [cx - a + u, cz - B] },
    { len: q,     p: u => arc(a, -b, 1.5 * Math.PI + u / R) },
    { len: 2 * b, p: u => [cx + A, cz - b + u] },
    { len: q,     p: u => arc(a, b, u / R) },
    { len: a,     p: u => [cx + a - u, cz + B] },
  ];
  const L = segs.reduce((s, g) => s + g.len, 0);
  const pt = s => { s = ((s % L) + L) % L; for (const g of segs) { if (s <= g.len) return g.p(s); s -= g.len; } return segs[0].p(0); };
  const at = s => {
    const [x, z] = pt(s), [x2, z2] = pt(s + 0.01), dx = (x2 - x) / 0.01, dz = (z2 - z) / 0.01;
    return { x, z, h: Math.atan2(-dz, dx), hp: Math.atan2(dx, dz), nx: -dz, nz: dx };   // h: +x forward, hp: +z forward, n: inward
  };
  return { L, at, a, b, q };
}
const offLoop = off => makeRR(0, 0, CA + off, CB + off, CR + off);
function rrShape(A, B, R, path) {
  R = Math.max(R, 0.001);
  const a = A - R, b = B - R;
  path.moveTo(-a, -B); path.lineTo(a, -B); path.absarc(a, -b, R, -Math.PI / 2, 0, false);
  path.lineTo(A, b); path.absarc(a, b, R, 0, Math.PI / 2, false);
  path.lineTo(-a, B); path.absarc(-a, b, R, Math.PI / 2, Math.PI, false);
  path.lineTo(-A, -b); path.absarc(-a, -b, R, Math.PI, 1.5 * Math.PI, false);
  return path;
}
function flatRR(cx, cz, A, B, R, o0, o1, h, y = 0) {
  const s = rrShape(A + o1, B + o1, R + o1, new THREE.Shape());
  if (o0 !== null) s.holes.push(rrShape(A + o0, B + o0, R + o0, new THREE.Path()));
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 24 });
  g.rotateX(-Math.PI / 2);
  g.translate(cx, y, cz);
  return g;
}

// ---------- shared instanced parts
const SKINS = ['#f0cfae', '#d9a882', '#b98563', '#8d5f43'];
const SHIRTS = ['#3a3633', '#6b645d', '#f4efe6', '#a39b91', '#4f9fe6', '#57cbbb', '#e6a15b'];
const bodies = new Inst(rbox(0.42, 0.66, 0.28, 0.12), mat('#ffffff', 0.8), 90);
const heads = new Inst(new THREE.SphereGeometry(0.16, 18, 12), mat('#ffffff', 0.7), 90);
const BH = 0.66;
function person(group, x, z, o = {}) {
  const seated = !!o.seated, bh = seated ? 0.46 : BH, lift = seated ? 0.42 : 0, floor = o.floor ?? PAD_Y;
  const sy = bh / BH;
  let ct = NaN, cv = null;
  const get = (t, tf) => (ct === tf ? cv : (ct = tf, cv = o.anim(t, tf)));
  const b = bodies.add(group, x, floor + lift + bh / 2, z, { color: o.shirt ?? pick(SHIRTS), sy, ry: o.ry || 0, start: o.start });
  const h = heads.add(group, x, floor + lift + bh + 0.15, z, { color: o.skin ?? pick(SKINS), start: o.start });
  if (o.anim) {
    b.anim = (S, t, tf) => { const v = get(t, tf), f = v.floor ?? floor; S.x = v.x; S.z = v.z; S.ry = v.ry; S.y = f + lift + bh / 2 + (v.bob || 0); };
    h.anim = (S, t, tf) => { const v = get(t, tf), f = v.floor ?? floor; S.x = v.x; S.z = v.z; S.y = f + lift + bh + 0.15 + (v.bob || 0) + (v.nod || 0); };
  }
}
// keyframed walks: [[t, x, z], ...] from 0 to D, ending where they start
function kf(keys) {
  const segs = [];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, x0, z0] = keys[i], [t1, x1, z1] = keys[i + 1], dx = x1 - x0, dz = z1 - z0, len = Math.hypot(dx, dz);
    segs.push({ t0, t1, x0, z0, dx, dz, len, h: len > 1e-4 ? Math.atan2(dx, dz) : null });
  }
  const n = segs.length;
  for (let i = 0; i < n; i++) if (segs[i].h === null) for (let j = 1; j <= n; j++) { const s = segs[(i + j) % n]; if (s.h !== null) { segs[i].h = s.h; break; } }
  for (let i = 0; i < n; i++) { segs[i].h ??= 0; segs[i].hp = segs[(i - 1 + n) % n].h ?? segs[i].h; }
  return t => {
    let s = segs[n - 1];
    for (const g of segs) if (t < g.t1) { s = g; break; }
    const u = clamp((t - s.t0) / (s.t1 - s.t0)), e = s.len ? smooth(u) : 0;
    return { x: s.x0 + s.dx * e, z: s.z0 + s.dz * e, ry: lerpAngle(s.hp, s.h, smooth(clamp(u / 0.2))),
      bob: s.len ? 0.035 * Math.abs(Math.sin(Math.PI * e * s.len / 0.42)) : 0 };
  };
}

function gable(parent, w, h, d, color, x, y, z, alongZ = false) {
  const s = new THREE.Shape(); s.moveTo(-d / 2, 0); s.lineTo(d / 2, 0); s.lineTo(0, h); s.lineTo(-d / 2, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: w, bevelEnabled: false });
  g.translate(0, 0, -w / 2); if (!alongZ) g.rotateY(Math.PI / 2);
  return mesh(g, color, x, y, z, parent);
}

  const DUSK = ['#f6c38a', '#ef9f6d', '#e6a15b', '#57cbbb', '#4f9fe6', '#2f4f7f'].map(c => new THREE.Color(c));
  const duskAt = (u, out) => { u = fract(u) * DUSK.length; const i = Math.floor(u), f = u - i; return out.copy(DUSK[i % DUSK.length]).lerp(DUSK[(i + 1) % DUSK.length], smooth(f)); };
  for (let r = 0; r < 6; r++) for (let c = 0; c < 12; c++) {
    const x = 19.7 - 2.2 + c * 0.4, y = FL + 0.32 + r * 0.44, col = new THREE.Color();
    tiles.add(G, x, y, -10.95, { anim: (S, t) => { S.c = duskAt(t / D + c / 24 - r / 30, col); } });
  }
  // bright white studio light on the talent, a warm wash in front of the LED wall
  lamp(G, 'spot', '#ffffff', 90, 18.6, FL + 3.0, -5.3, { at: [TX, FL + 0.8, TZ], angle: 0.55, dist: 10 });
  lamp(G, 'spot', '#ffffff', 90, 18.6, FL + 3.0, -3.1, { at: [TX, FL + 0.8, TZ], angle: 0.55, dist: 10 });
  lamp(G, 'point', '#ffe6c8', 6, 19.7, FL + 1.6, -10.2, { dist: 5 });
  lamp(G, 'point', '#fff1dc', 5, 19.6, FL + 1.8, 6.6, { dist: 5 });
  pool(G, TX - 0.6, TZ, 3.0, '#ffffff', 0.75);
  pool(G, 17.0, TZ, 2.4, '#fff6ea', 0.35);
  pool(G, 19.7, -10.1, 2.2, '#ffcf9a', 0.3);
}

// ================= TRAFFIC: the pipeline, one way around the loop =================
const carLane = offLoop(-0.75), bikeLane = offLoop(1.5);
function car(color, van) {
  const g = new THREE.Group();
  if (van) { box(g, 2.7, 1.1, 1.24, color, 0, 0.22, 0, 0.16); box(g, 0.06, 0.42, 1.08, '#dfe6ea', 1.33, 0.78, 0, 0.02); box(g, 0.9, 0.06, 1.0, '#f4efe6', -0.3, 1.32, 0, 0.03); }
  else { box(g, 2.5, 0.5, 1.2, color, 0, 0.2, 0, 0.18); box(g, 1.35, 0.42, 1.04, '#dfe6ea', -0.12, 0.66, 0, 0.16); box(g, 1.2, 0.06, 1.06, color, -0.12, 1.06, 0, 0.03); }
  for (const [x, z] of [[-0.8, -0.56], [0.8, -0.56], [-0.8, 0.56], [0.8, 0.56]]) { const w = mesh(cylGeo(0.22, 0.22, 0.16, 16), '#2a2725', x, 0.22, z, g); w.rotation.x = Math.PI / 2; }
  for (const z of [-0.38, 0.38]) box(g, 0.04, 0.1, 0.18, glowMat('#fff6e0', 1.0), van ? 1.36 : 1.25, 0.42, z, 0.02);
  return g;
}
const CARS = [['#57cbbb', false], ['#f4efe6', false], ['#e6a15b', true], ['#6b645d', false]];
const carAt = (i, t) => carLane.at((fract(t / D + i / CARS.length)) * carLane.L);     // one lap per loop, evenly spaced
CARS.forEach(([c, van], i) => { const g = car(c, van), p = carAt(i, 0); g.position.set(p.x, 0.06, p.z); g.rotation.y = p.h;
  piece(g, 'base', { anim: (o, t) => { const p = carAt(i, t); o.position.set(p.x, 0.06, p.z); o.rotation.y = p.h; } }); });

// motorbikes, the Saigon way: swarms in the gaps behind two of the cars, at the same pace (one lap per loop),
// so they never touch the cars; the other two gaps stay clear for people crossing
const MBIKES = [];
for (const q of [0, 2]) for (let k = 0; k < 5; k++) MBIKES.push({ f: q / 4 + 0.045 + k * 0.038, lat: [-0.55, 0.45, -0.1, 0.55, -0.45][k] });
const mbAt = (m, t) => { const p = carLane.at(fract(t / D + m.f) * carLane.L); return { ...p, x: p.x + p.nx * m.lat, z: p.z + p.nz * m.lat }; };
const mbBody = new Inst(rbox(0.8, 0.24, 0.26, 0.08), mat('#ffffff', 0.45), 12), mbSeat = new Inst(rbox(0.4, 0.08, 0.24, 0.03), mat('#2a2725', 0.8), 12);
const mbWheel = new Inst(new THREE.CylinderGeometry(0.14, 0.14, 0.08, 12).rotateX(Math.PI / 2), mat('#2a2725', 0.8), 24), mbBar = new Inst(rbox(0.05, 0.05, 0.44, 0.02), mat(N.dark, 0.6), 12);
const MB_COL = ['#f4efe6', '#c9503a', '#3f73c8', '#3a3633', '#e3b44a', '#6b645d'], HELMET = ['#f4efe6', '#e8573f', '#4f9fe6', '#f3c99a', '#3a3633'];
const at3 = (m, t, fwd, y) => { const p = mbAt(m, t), c = Math.cos(p.h), s = Math.sin(p.h); return { x: p.x + fwd * c, z: p.z - fwd * s, y, h: p.h, hp: p.hp }; };
MBIKES.forEach(m => {
  const place = (fwd, y) => (S, t) => { const v = at3(m, t, fwd, y); S.x = v.x; S.z = v.z; S.y = v.y; S.ry = v.h; };
  mbBody.add('base', 0, 0.36, 0, { color: pick(MB_COL), anim: place(0, 0.36) });
  mbSeat.add('base', 0, 0.52, 0, { anim: place(-0.12, 0.52) });
  for (const fwd of [-0.32, 0.32]) mbWheel.add('base', 0, 0.2, 0, { anim: place(fwd, 0.2) });
  mbBar.add('base', 0, 0.74, 0, { anim: place(0.3, 0.74) });
  person('base', 0, 0, { seated: true, floor: 0.12, skin: pick(HELMET), anim: t => { const v = at3(m, t, -0.14, 0); return { x: v.x, z: v.z, ry: v.hp, floor: 0.12 }; } });
});

// scooters: ease to a stop at each district's curb, then pull away; one lap per loop
const DWELL = 0.055, MOVE = 1 - 3 * DWELL;
function scoot(p) {   // p in [0,1): returns arc fraction and stop progress (-1 while moving)
  const legs = [[0.75, 1.25, MOVE * 0.5], [0.25, 0.5, MOVE * 0.25], [0.5, 0.75, MOVE * 0.25]];
  let t = p;
  for (const [a, b, dur] of legs) {
    if (t < dur) return { f: fract(a + (b - a) * smooth(t / dur)), stop: -1 };
    t -= dur;
    if (t < DWELL) return { f: fract(b), stop: t / DWELL };
    t -= DWELL;
  }
  return { f: 0.75, stop: -1 };
}
const SCOOTERS = 3;
const scooterAt = (j, t) => { const s = scoot(fract(t / D + j / SCOOTERS)); return { ...bikeLane.at(s.f * bikeLane.L), stop: s.stop }; };
for (let j = 0; j < SCOOTERS; j++) {
  const g = new THREE.Group();
  box(g, 0.95, 0.07, 0.3, N.dark, 0, 0.13, 0, 0.03);
  for (const x of [-0.38, 0.38]) { const w = mesh(cylGeo(0.12, 0.12, 0.08, 14), '#2a2725', x, 0.12, 0, g); w.rotation.x = Math.PI / 2; }
  const col = box(g, 0.05, 0.85, 0.05, N.dark, 0.4, 0.18, 0, 0.02); col.rotation.z = 0.15;
  box(g, 0.05, 0.04, 0.5, N.dark, 0.33, 1.02, 0, 0.02);
  box(g, 0.3, 0.06, 0.3, N.dark, -0.42, 0.3, 0, 0.02);
  const parcel = box(g, 0.4, 0.34, 0.4, ACC, -0.42, 0.36, 0, 0.05);
  const p = scooterAt(j, 0); g.position.set(p.x, 0.075, p.z); g.rotation.y = p.h;
  piece(g, 'base', { anim: (o, t) => { const p = scooterAt(j, t); o.position.set(p.x, 0.075, p.z); o.rotation.y = p.h;
    parcel.position.y = 0.53 + (p.stop >= 0 ? 0.28 * Math.sin(Math.PI * p.stop) : 0); } });
  person('base', p.x, p.z, { floor: 0.2, shirt: '#f4efe6', anim: t => { const p = scooterAt(j, t), c = Math.cos(p.h), s = Math.sin(p.h);
    return { x: p.x + 0.05 * c, z: p.z - 0.05 * s, ry: p.hp, floor: 0.2 }; } });
}

// ---------- people: long walks over the full loop (sidewalks, the riverside, through the square). Before each
// crossing a walker waits at the curb for a real gap in the traffic; routes are timed so walkers don't meet.
const CROSS_T = 2.0;
const sdRR = (x, z, A, B, R) => { const qx = Math.abs(x) - (A - R), qz = Math.abs(z) - (B - R); return Math.hypot(Math.max(qx, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qz), 0) - R; };
const floorAt = (x, z) => { const d = sdRR(x, z, CA, CB, CR); return Math.abs(d) <= ROAD ? 0.075 : Math.abs(d) <= WALK ? 0.2 : d < 0 ? 0.16 : z > 15.2 ? 0.06 : 0; };
function crossClear(c, from, to, t0) {
  const [nx, nz] = c.n, tx = nz, tz = -nx;
  const near = (p, along) => Math.abs((p.x - c.cx) * tx + (p.z - c.cz) * tz) < along && Math.abs((p.x - c.cx) * nx + (p.z - c.cz) * nz) < 3;
  const conflict = (x, z, t) => {
    const o = (x - c.cx) * nx + (z - c.cz) * nz;
    if (o > -2.3 && o < 0.85) { for (let i = 0; i < CARS.length; i++) if (near(carAt(i, t), 3.2)) return true; for (const m of MBIKES) if (near(mbAt(m, t), 1.8)) return true; }
    if (o > 0.65 && o < 2.3) for (let j = 0; j < SCOOTERS; j++) if (near(scooterAt(j, t), 2.2)) return true;
    return false;
  };
  for (let s = 0; s <= CROSS_T; s += 0.04) { const e = smooth(s / CROSS_T); if (conflict(from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e, (t0 + s) % D)) return false; }
  return true;
}
// a route is a start point and steps ([x, z], or { to: [x, z], cross: index into CROSS }), walked at one pace
// from absolute time t0; keyframes cover [t0, t0 + LOOP], ending back at the start with a short pause
function planRoute(start, steps, t0) {
  for (let v = 0.9; v < 3; v *= 1.05) {
    let tau = t0, at = start, ok = true;
    const keys = [[tau, ...at]];
    for (const st of steps) {
      const to = st.to || st;
      if (st.cross !== undefined) {
        let w = tau;
        while (w < tau + 12 && !crossClear(CROSS[st.cross], at, to, w)) w += 0.05;
        if (w >= tau + 12) { ok = false; break; }
        if (w > tau) keys.push([w, ...at]);
        tau = w + CROSS_T;
      } else tau += Math.hypot(to[0] - at[0], to[1] - at[1]) / v;
      at = to; keys.push([tau, ...at]);
    }
    if (ok && tau <= t0 + LOOP - 0.6) { keys.push([t0 + LOOP, ...start]); return { keys, ok: true }; }
  }
  return { keys: [[t0, ...start], [t0 + LOOP, ...start]], ok: false };
}
const walkers = [], walkInfo = [];
function walker(name, start, steps) {
  let best = null;
  for (const t0 of [0, 7.5, 15, 22.5, 30, 37.5, 45, 52.5, 3.75, 11.25, 18.75, 26.25, 33.75, 41.25, 48.75, 56.25]) {
    const plan = planRoute(start, steps, t0);
    if (!plan.ok) continue;
    const path = kf(plan.keys), at = tf => path(tf < t0 ? tf + LOOP : tf);
    let minD = 1e9;
    for (let tf = 0; tf < LOOP; tf += 0.2) { const p = at(tf); for (const w of walkers) { const q = w(tf); minD = Math.min(minD, Math.hypot(p.x - q.x, p.z - q.z)); } }
    if (!best || minD > best.minD) best = { at, minD, t0 };
    if (minD > 0.7) break;
  }
  walkInfo.push({ name, ok: !!best, t0: best?.t0, minD: best ? +best.minD.toFixed(2) : null });
  if (!best) return;
  walkers.push(best.at);
  person('base', start[0], start[1], { floor: floorAt(...start), anim: (t, tf) => { const v = best.at(tf); v.floor = floorAt(v.x, v.z); return v; } });
}
// through the square: in at the near crossing, around the cathedral and past the Post Office, back out
walker('square', [2, 14.4], [[-3, 14.45], { to: [-3, 8.55], cross: 0 }, [-3, 6.4], [-4.6, 3.2], [-4.7, -2.8], [-3.4, -4.75], [3.4, -4.75], [4.7, -1.2], [4.5, 3.4], [1.6, 5.7], [-3, 6.4], [-3, 8.55], { to: [-3, 14.45], cross: 0 }, [2, 14.4]]);
// up the research side, across to the bench by the cathedral, and back
walker('research side', [-13.4, -9], [[-13.45, 6], { to: [-7.55, 6], cross: 1 }, [-5.4, 6], [-4.4, 3.4], [-4.3, 0.4], [-3.6, -0.3], [-4.3, 0.4], [-4.4, 3.4], [-5.4, 6], [-7.55, 6], { to: [-13.45, 6], cross: 1 }, [-13.4, -9]]);
// the production side, the AI side and the riverside promenade, end to end and back
walker('production side', [13.4, -9], [[13.4, 9], [13.4, -9]]);
walker('AI side', [-9, -14.4], [[9, -14.4], [-9, -14.4]]);
walker('riverside', [-12.8, 16.1], [[12.8, 16.1], [-12.8, 16.1]]);

// ================= overlay =================
const card = document.getElementById('card');
card.classList.add(PORTRAIT ? 'portrait' : 'landscape');
document.getElementById('fname').textContent = CONFIG.windowTitle;
document.getElementById('title').textContent = CONFIG.title;
document.getElementById('sub').textContent = CONFIG.subtitle;
const ZONES = [
  { ...ZN.research, group: 'research', anchor: new THREE.Vector3(-18.9, 3.0, -1) },
  { ...ZN.aiWork, group: 'ai', anchor: new THREE.Vector3(0, 3.6, -19.4) },
  { ...ZN.production, group: 'production', anchor: new THREE.Vector3(18.9, 3.0, -1) },
];
const statsEl = document.getElementById('stats'), ui = document.getElementById('ui');
for (const z of ZONES) {
  const m = /^(\d+)(.*)$/.exec(z.stat);
  z.num = +m[1]; z.suffix = m[2];
  const s = document.createElement('div'); s.className = 'stat';
  s.innerHTML = `<div class="n"></div><div class="l"><span class="dot"></span><span></span></div>`;
  s.querySelector('.dot').style.background = z.color;
  s.querySelector('.l span:last-child').textContent = z.label;
  statsEl.appendChild(s);
  z.nEl = s.querySelector('.n'); z.dotEl = s.querySelector('.dot');
  const p = document.createElement('div'); p.className = 'pill';
  p.innerHTML = `<span class="dot"></span><span></span>`;
  p.querySelector('.dot').style.background = z.color;
  p.querySelector('span:last-child').textContent = z.name;
  ui.appendChild(p); z.pill = p;
}
const _v = new THREE.Vector3();
function drawOverlay(T, t) {
  card.style.opacity = INTRO ? clamp(T / 0.35) : 1;
  ZONES.forEach((z, i) => {
    const e = T >= INTRO ? 1 : easeOutCubic(clamp((T - 0.15) / Math.max(0.01, INTRO - 0.3)));
    z.nEl.textContent = Math.round(z.num * e) + (e >= 1 ? z.suffix : '');
    const pulse = T >= INTRO ? 0.5 + 0.5 * wave(t, 2, -i / 3) : 0;            // stats hold; only the dot breathes
    z.dotEl.style.boxShadow = `0 0 0 ${(pulse * 0.6).toFixed(3)}rem ${z.color}33`;
    _v.copy(z.anchor).project(camera);
    z.pill.style.transform = `translate(${((_v.x + 1) / 2 * W).toFixed(1)}px, ${((1 - _v.y) / 2 * H).toFixed(1)}px) translate(-50%, -100%)`;
    z.pill.style.opacity = INTRO ? clamp((T - GROUPS[z.group].start - 0.25) / 0.3) : 1;
  });
}

// ================= camera: framed once, then a gentle swing and push-in per loop =================
// a tall frame is width-limited, so it looks down a little more steeply and uses the height
const TGT = new THREE.Vector3(0, 0.6, 0), BASE_YAW = 25 * Math.PI / 180, PITCH = (PORTRAIT ? 44 : 32) * Math.PI / 180, SWAY = 15 * Math.PI / 180;
let DIST = 150;
function placeCamera(yaw, dist) {
  camera.position.set(TGT.x + dist * Math.cos(PITCH) * Math.sin(yaw), TGT.y + dist * Math.sin(PITCH), TGT.z + dist * Math.cos(PITCH) * Math.cos(yaw));
  camera.lookAt(TGT); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
}
function frameCamera() {
  const rem = Math.min(W, H) / 108, cardOn = card.offsetWidth > 0, cardBottom = card.offsetTop + card.offsetHeight;
  const free = PORTRAIT ? { x0: 3 * rem, x1: W - 3 * rem, y0: cardOn ? cardBottom + 3 * rem : 3 * rem, y1: H - 4 * rem }
                        : { x0: cardOn ? card.offsetLeft + card.offsetWidth * 0.45 : 1.5 * rem, x1: W - 1.5 * rem, y0: 1.5 * rem, y1: H - 1.5 * rem };
  const pts = [];
  for (const x of [-24.2, 24.2]) for (const z of [-24.8, 24.8]) for (const y of [-3.3, 2.6]) pts.push(new THREE.Vector3(x, y, z));
  pts.push(new THREE.Vector3(-19.3, 12.3, -19.8), new THREE.Vector3(19.3, 9.7, -19.8), new THREE.Vector3(-19.2, 4.6, 18.3));   // Landmark 81, Bitexco, Ben Thanh's clock tower
  camera.clearViewOffset();
  const bounds = (dist, yaws) => { let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const yaw of yaws) { placeCamera(yaw, dist); for (const p of pts) { _v.copy(p).project(camera); const px = (_v.x + 1) / 2 * W, py = (1 - _v.y) / 2 * H; x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); } }
    return { x0, x1, y0, y1 }; };
  const yaws = [-1, -0.5, 0, 0.5, 1].map(k => BASE_YAW + k * SWAY);
  // a tall frame fits the resting pose (the swing may graze the sides); a wide one keeps the whole swing inside
  const fitYaws = PORTRAIT || STILL ? [BASE_YAW] : yaws, fill = PORTRAIT ? 0.97 : STILL ? 0.985 : 0.92;
  for (let i = 0; i < 6; i++) { const b = bounds(DIST, fitYaws), r = Math.max((b.x1 - b.x0) / (free.x1 - free.x0), (b.y1 - b.y0) / (free.y1 - free.y0)); DIST *= r / fill; }
  const b = bounds(DIST, [BASE_YAW]);
  camera.setViewOffset(W, H, (b.x0 + b.x1) / 2 - (free.x0 + free.x1) / 2, (b.y0 + b.y1) / 2 - (free.y0 + free.y1) / 2, W, H);
}
// on the site (?embed=1) the camera holds still and only the world moves; ?camera=swing / ?camera=still override
const STILL = Q.get('camera') ? Q.get('camera') === 'still' : EMBED;
function poseCamera(T, t) {
  const ph = STILL ? 0 : TAU * t / D;
  let dist = DIST * (1 - 0.1 * (0.5 - 0.5 * Math.cos(ph)));
  if (T < INTRO && !STILL) dist *= 1 + 0.12 * (1 - easeOutCubic(T / INTRO));
  placeCamera(BASE_YAW + SWAY * Math.sin(ph), dist);
}

// ================= one frame =================
function draw(T) {
  const tf = T < INTRO ? 0 : (((T - INTRO) % LOOP) + LOOP) % LOOP, t = tf % D;   // full-loop time, and beat time
  slab.position.y = T < INTRO ? -7 * (1 - easeOutCubic(clamp(T / 0.5))) : 0;
  for (const p of pieces) {
    p.obj.position.y = p.baseY;
    if (p.anim) p.anim(p.obj, t, tf);
    const [dy, sc] = build(T, p.start);
    p.obj.position.y += dy;
    p.obj.scale.copy(p.baseS).multiplyScalar(Math.max(sc, 1e-4));
    p.obj.visible = sc > 1e-3;
  }
  for (const i of insts) i.update(T, t, tf);
  for (const l of lights) l.L.intensity = l.base * clamp(build(T, l.start)[1]) * (l.anim ? l.anim(t) : 1);
  recMat.color.set(fract(t) < 0.55 ? ACC : '#4a3a36');                         // REC blinks once a second
  faceBg.color.copy(FACE_BASE).multiplyScalar(0.9 + 0.12 * wave(t, 2));          // every face screen pulses together
  poseCamera(T, t);
  drawOverlay(T, t);
  composer.render();
}

// ================= frame scaling, export API, autoplay =================
const frame = document.getElementById('frame');
frame.style.width = W + 'px'; frame.style.height = H + 'px';
document.documentElement.style.fontSize = (Math.min(W, H) / 108) + 'px';
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); frame.style.transform = `translate(${-W * s / 2}px, ${-H * s / 2}px) scale(${s})`; }
fit(); addEventListener('resize', fit);

window.CONFIG = CONFIG;
window.TIMELINE = { introDuration: INTRO, duration: LOOP, beat: D, fps: FPS, introFrames: Math.round(INTRO * FPS), loopFrames: Math.round(LOOP * FPS) };
// resolves once the canvas and the HTML overlay have painted (a hidden tab never paints, so it doesn't wait there)
window.renderAt = T => { draw(T); return new Promise(r => document.hidden ? setTimeout(r, 0) : requestAnimationFrame(() => requestAnimationFrame(r))); };
window.__debug = { walkInfo, scene };

window.ready = (async () => {
  await Promise.all([document.fonts.load('600 40px "Space Grotesk"'), document.fonts.load('400 40px "Space Grotesk"'), document.fonts.load('500 40px "IBM Plex Mono"')]).catch(() => {});
  await document.fonts.ready;
  frameCamera();
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (EXPORT || still) { await window.renderAt(INTRO); return; }
  let start = null, offset = 0, raf = 0;
  const tick = now => { if (start === null) start = now; draw(offset + (now - start) / 1000); raf = requestAnimationFrame(tick); };
  raf = requestAnimationFrame(tick);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); if (start !== null) offset += (performance.now() - start) / 1000; start = null; }
    else raf = requestAnimationFrame(tick);
  });
})();
